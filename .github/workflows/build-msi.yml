name: Build ExplorerPatcher Real EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
    
    # 💡 [핵심 해결책] 배치 파일 내부의 'Visual Studio 18 2026' 글자를 'Visual Studio 17 2022'로 강제 수정합니다.
    - name: Patch VS 2026 to VS 2022
      run: |
        powershell -Command "(Get-Content BuildDependenciesRelease.bat) -replace 'Visual Studio 18 2026', 'Visual Studio 17 2022' | Set-Content BuildDependenciesRelease.bat"
      shell: cmd

    # 1단계: 누겟 복구 및 패치된 스크립트로 의존성 컴파일 수행
    - name: Restore and Build Dependencies
      run: |
        nuget restore ExplorerPatcher.sln
        call BuildDependenciesRelease.bat
      shell: cmd

    # 2단계: 공식 빌드 규격에 맞춰 IA-32와 amd64 아키텍처를 순서대로 전면 컴파일
    - name: Compile Real ExplorerPatcher Source
      run: |
        msbuild ExplorerPatcher.sln /p:Configuration="Release" /p:Platform="IA-32"
        msbuild ExplorerPatcher.sln /p:Configuration="Release" /p:Platform="amd64"
      shell: cmd

    # 3단계: 최종 완성된 공식 규격의 진짜 ep_setup.exe 결과물 업로드
    - name: Upload Real Program Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExplorerPatcher-Official-Setup
        path: build/Release/ep_setup.exe
