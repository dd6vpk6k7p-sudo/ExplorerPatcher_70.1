name: Build ExplorerPatcher Real MSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
    
    # 1. 💡 [작업 관리자 이름 치환] C++ 리소스 파일(.rc) 내의 제품명을 JK_Layout으로 강제 변경합니다.
    - name: Patch Task Manager Program Name (Resource Files)
      run: |
        powershell -Command "Get-ChildItem -Filter *.rc -Recurse | ForEach-Object { (Get-Content $_.FullName) -replace 'ExplorerPatcher', 'JK_Layout' -replace 'Explorer Patcher', 'JK_Layout' | Set-Content $_.FullName }"
      shell: cmd

    # 2. 컴파일러 버전 및 스크립트 요구 조건 하향 패치
    - name: Patch VS 2026 to VS 2022 (Batch)
      run: |
        powershell -Command "(Get-Content BuildDependenciesRelease.bat) -replace 'Visual Studio 18 2026', 'Visual Studio 17 2022' | Set-Content BuildDependenciesRelease.bat"
      shell: cmd

    - name: Patch Platform Toolset v145 to v143
      run: |
        powershell -Command "Get-ChildItem -Filter *.vcxproj -Recurse | ForEach-Object { (Get-Content $_.FullName) -replace '<PlatformToolset>v145</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>' | Set-Content $_.FullName }"
      shell: cmd

    # 3. 의존성 및 본체 컴파일 진행
    - name: Restore and Build Dependencies
      run: |
        nuget restore ExplorerPatcher.sln
        call BuildDependenciesRelease.bat
      shell: cmd

    - name: Compile Real ExplorerPatcher Source
      run: |
        msbuild ExplorerPatcher.sln /p:Configuration="Release" /p:Platform="IA-32"
        msbuild ExplorerPatcher.sln /p:Configuration="Release" /p:Platform="amd64"
      shell: cmd

    # 4. 컴파일 완료된 진짜 실행 파일 명칭 자체를 'JK_Layout.exe'로 강제 변경하여 복사
    - name: Locate, Rename and Copy Real Binary
      run: |
        powershell -Command "Copy-Item (Get-ChildItem -Filter ep_setup.exe -Recurse | Select-Object -First 1).FullName -Destination ./JK_Layout.exe"
      shell: cmd

    # 5. 제어판 등록 정보를 완벽하게 매핑한 WiX 설정 파일 가상 생성
    - name: Generate Safe WiX File
      run: |
        $wxs = @"
        <?xml version="1.0" encoding="UTF-8"?>
        <Wix xmlns="http://microsoft.com">
          <Product Id="*" Name="JK_Layout" Language="1042" Version="1.0.0" Manufacturer="JK_Layout Team" UpgradeCode="12345678-1234-1234-1234-123456789ABC">
            <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" InstallPrivileges="elevated" />
            <Media Id="1" Cabinet="media1.cab" EmbedCab="yes" />
            <Directory Id="TARGETDIR" Name="SourceDir">
              <Directory Id="ProgramFilesFolder">
                <Directory Id="INSTALLFOLDER" Name="JK_Layout">
                  <Component Id="MainApp" Guid="87654321-4321-4321-4321-CBA987654321">
                    <File Id="EP_Exe" Name="JK_Layout.exe" Source="JK_Layout.exe" KeyPath="yes" />
                  </Component>
                </Directory>
              </Directory>
            </Directory>
            <CustomAction Id="LaunchQuietly" FileKey="EP_Exe" ExeCommand="/silent" Execute="deferred" Return="ignore" Impersonate="no" />
            <InstallExecuteSequence>
              <Custom Action="LaunchQuietly" After="InstallFiles">NOT Installed</Custom>
            </InstallExecuteSequence>
            <Feature Id="MainFeature" Title="JK_Layout" Level="1">
              <ComponentRef Id="MainApp" />
            </Feature>
          </Product>
        </Wix>
        "@
        Set-Content -Path final_build.wxs -Value $wxs -Encoding UTF8
      shell: pwsh

    # 6. 최종 .msi 설치 파일 패키징
    - name: Packaging Final MSI
      run: |
        candle.exe final_build.wxs
        light.exe -sval final_build.wixobj -out JK_Layout.msi
      shell: cmd

    # 7. 완성된 최종 진짜 JK_Layout.msi 파일 보관함 업로드
    - name: Upload Real MSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JK_Layout-Final-MSI
        path: JK_Layout.msi
