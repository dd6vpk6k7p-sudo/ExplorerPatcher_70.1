name: Build MSI Installer

on:
  workflow_dispatch:

# 💡 시스템이 요구한 Node.js 24 강제 전환 설정을 환경 변수로 등록합니다.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-2022

    steps:
    # 1단계: 소스 코드 가져오기
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2단계: 환경 설정 파일 실시간 생성
    - name: Generate Source File
      run: |
        echo "ExplorerPatcher Build Note" > build_note.txt
      shell: cmd

    # 3단계: 임시 WXS 소스 파일 작성 (경로 문제 차단)
    - name: Generate WiX Source File
      run: |
        cat << 'EOF' > test_build.wxs
        <?xml version="1.0" encoding="UTF-8"?>
        <Wix xmlns="http://microsoft.com">
          <Product Id="*" Name="ExplorerPatcher" Language="1042" Version="1.0.0" Manufacturer="ExplorerPatcher Team" UpgradeCode="12345678-1234-1234-1234-123456789ABC">
            <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />
            <MajorUpgrade DowngradeErrorMessage="이미 더 새로운 버전이 설치되어 있습니다." />
            <MediaTemplate EmbedCab="yes" />
            <Directory Id="TARGETDIR" Name="SourceDir">
              <Directory Id="ProgramFilesFolder">
                <Directory Id="INSTALLFOLDER" Name="ExplorerPatcher" />
              </Directory>
            </Directory>
            <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">
              <Component Id="MainConfig" Guid="87654321-4321-4321-4321-CBA987654321">
                <File Id="ConfigNote" Name="Readme.txt" Source="build_note.txt" KeyPath="yes" />
              </Component>
            </ComponentGroup>
            <Feature Id="MainFeature" Title="ExplorerPatcher Installation" Level="1">
              <ComponentGroupRef Id="ProductComponents" />
            </Feature>
          </Product>
        </Wix>
        EOF
      shell: bash

    # 4단계: 컴파일 및 빌드
    - name: Compile WiX Source
      run: |
        candle.exe test_build.wxs
        light.exe test_build.wixobj -out ExplorerPatcher.msi
      shell: cmd

    # 5단계: 최종 파일 업로드
    - name: Upload MSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExplorerPatcher-MSI
        path: ExplorerPatcher.msi
