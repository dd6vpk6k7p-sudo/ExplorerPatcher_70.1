name: Build ExplorerPatcher Real MSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
    
    # 1. 컴파일러 버전 하향 패치
    - name: Patch VS 2026 to VS 2022 (Batch)
      run: |
        powershell -Command "(Get-Content BuildDependenciesRelease.bat) -replace 'Visual Studio 18 2026', 'Visual Studio 17 2022' | Set-Content BuildDependenciesRelease.bat"
      shell: cmd

    - name: Patch Platform Toolset v145 to v143
      run: |
        powershell -Command "Get-ChildItem -Filter *.vcxproj -Recurse | ForEach-Object { (Get-Content $_.FullName) -replace '<PlatformToolset>v145</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>' | Set-Content $_.FullName }"
      shell: cmd

    # 2. 의존성 및 본체 컴파일 진행
    - name: Restore and Build Dependencies
      run: |
        nuget restore ExplorerPatcher.sln
        call BuildDependenciesRelease.bat
      shell: cmd

    - name: Compile Real ExplorerPatcher Source
      run: |
        msbuild ExplorerPatcher.sln /p:Configuration="Release" /p:Platform="IA-32"
        msbuild ExplorerPatcher.sln /p:Configuration="Release" /p:Platform="amd64"
      shell: cmd

    # 3. 컴파일 완료된 진짜 실행 파일을 루트 경로로 복사
    - name: Locate and Copy Real Binary
      run: |
        powershell -Command "Copy-Item (Get-ChildItem -Filter ep_setup.exe -Recurse | Select-Object -First 1).FullName -Destination ./ep_setup.exe"
      shell: cmd

    # 4. 💡 [핵심 교정] InstallPrivileges 옵션을 'elevated'로 완벽하게 수정했습니다.
    - name: Generate Safe WiX File
      run: |
        $wxs = '<?xml version="1.0" encoding="UTF-8"?><Wix xmlns="http://microsoft.com"><Product Id="*" Name="JK_Layout" Language="1042" Version="1.0.0" Manufacturer="ExplorerPatcher Team" UpgradeCode="12345678-1234-1234-1234-123456789ABC"><Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" InstallPrivileges="elevated" /><Media Id="1" Cabinet="media1.cab" EmbedCab="yes" /><Directory Id="TARGETDIR" Name="SourceDir"><Directory Id="ProgramFilesFolder"><Directory Id="INSTALLFOLDER" Name="JK_Layout"><Component Id="MainApp" Guid="87654321-4321-4321-4321-CBA987654321"><File Id="EP_Exe" Name="ep_setup.exe" Source="ep_setup.exe" KeyPath="yes" /></Component></Directory></Directory></Directory><CustomAction Id="LaunchQuietly" FileKey="EP_Exe" ExeCommand="/silent" Execute="deferred" Return="check" Impersonate="no" /><InstallExecuteSequence><Custom Action="LaunchQuietly" After="InstallFiles">NOT Installed</Custom></InstallExecuteSequence><Feature Id="MainFeature" Title="JK_Layout" Level="1"><ComponentRef Id="MainApp" /></Feature></Product></Wix>'
        Set-Content -Path final_build.wxs -Value $wxs -Encoding UTF8
      shell: pwsh

    # 5. 💡 [경로 조준 완료] 가상 컴파일 결과물인 final_build.wxs와 final_build.wixobj를 정확하게 지정하여 패키징합니다.
    - name: Packaging Final MSI
      run: |
        candle.exe final_build.wxs
        light.exe -sval final_build.wixobj -out ExplorerPatcher.msi
      shell: cmd

    # 6. 완성된 최종 진짜 .msi 파일 보관함 업로드
    - name: Upload Real MSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExplorerPatcher-Final-MSI
        path: ExplorerPatcher.msi
