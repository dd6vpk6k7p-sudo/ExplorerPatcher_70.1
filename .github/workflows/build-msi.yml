name: Build MSI Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1단계: Git 에러 방지를 위해 명시적으로 브랜치 체크아웃 설정
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # 속도 향상 및 오류 방지를 위해 최신 커밋 1개만 가져옵니다.

    # 2단계: WiX Toolset 설치 및 환경 변수 등록
    - name: Install and Setup WiX Toolset
      run: |
        dotnet tool install --global wix --version 4.0.5
        echo "C:\Users\runneradmin\.dotnet\tools" >> $GITHUB_PATH
      shell: pwsh

    # 3단계: WiX 컴파일 (WXS -> WIXOBJ)
    - name: Compile WiX Source
      run: |
        wix build ExplorerPatcher.wxs -o ExplorerPatcher.msi
      shell: pwsh

    # 4단계: 빌드된 MSI 파일을 GitHub 결과물로 업로드
    - name: Upload MSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExplorerPatcher-MSI
        path: ExplorerPatcher.msi
