name: Build MSI Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022 # 환경 변화 영향이 없는 안정적인 2022 버전을 강제 지정합니다.

    steps:
    # 1단계: 소스 코드 가져오기
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2단계: 기존에 탑재된 레거시 WiX v3 명령어(candle, light)를 사용해 빌드
    - name: Compile WiX Source
      run: |
        candle.exe ExplorerPatcher.wxs
        light.exe ExplorerPatcher.wixobj -out ExplorerPatcher.msi
      shell: cmd

    # 3단계: 빌드된 MSI 파일 저장
    - name: Upload MSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExplorerPatcher-MSI
        path: ExplorerPatcher.msi
